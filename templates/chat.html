<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoodCraft Furniture FAQ Assistant</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-amber-800 text-white p-4 shadow-md text-center font-bold text-xl">
        WoodCraft Furniture - FAQ Assistant
    </header>

    <!-- Chat Box Container -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <!-- Initial Assistant Message -->
        <div class="flex justify-start">
            <div class="bg-white p-3 rounded-lg shadow max-w-md text-gray-800 border border-gray-200">
                Hello! Welcome to WoodCraft Furniture. How can I help you with our products today?
            </div>
        </div>
    </div>

    <!-- Input Form Footer -->
    <div class="bg-white border-t border-gray-200 p-4 shadow-lg">
        <form id="chat-form" class="max-w-2xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Ask about our furniture, materials, or pricing..." 
                required
                class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-amber-700"
            >
            <button 
                type="submit" 
                class="bg-amber-800 text-white px-6 py-2 rounded-lg font-semibold hover:bg-amber-900 transition"
            >
                Send
            </button>
        </form>
    </div>

    <!-- JavaScript for Handling Chat -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const query = userInput.value.trim();
            if (!query) return;

            // 1. Append User Message
            appendMessage(query, 'user');
            userInput.value = '';
            scrollToBottom();

            // 2. Send Request to Flask Backend (/ask)
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();
                
                if (response.ok) {
                    appendMessage(data.answer, 'bot');
                } else {
                    appendMessage(data.error || 'Something went wrong!', 'bot');
                }
            } catch (error) {
                appendMessage('Failed to connect to server.', 'bot');
            }
            scrollToBottom();
        });

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const innerDiv = document.createElement('div');
            innerDiv.className = `p-3 rounded-lg shadow max-w-md ${
                sender === 'user' 
                    ? 'bg-amber-800 text-white' 
                    : 'bg-white text-gray-800 border border-gray-200'
            }`;
            innerDiv.textContent = text;

            messageDiv.appendChild(innerDiv);
            chatContainer.appendChild(messageDiv);
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
